const $=s=>document.getElementById(s);
function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function marked(t){return esc(t).replace(/\[([^\]]+)\]/g,'<mark>[$1]</mark>');}
function slug(c){return "cat-"+c.replace(/\s+/g,'_');}
function applyChrome(){const t=T[LANG];document.body.dataset.lang=LANG;$("langbtn").textContent=LANG==="zh"?"EN":"中";
  $("t-title").textContent=t.title;$("t-paperlab").textContent=t.paperlab;
  $("t-cases").textContent=t.cases;$("t-cats").textContent=t.cats;$("t-methods").textContent=t.methods;
  // subtitle 始终中英双语 (English translation always shown)
  $("t-sub").innerHTML=(LANG==="zh"?SUB_ZH:SUB_EN)+'<span class="en">'+(LANG==="zh"?SUB_EN:SUB_ZH)+'</span>';}
function render(){
  if(!DATA)return;const t=T[LANG],{METHODS,sel,groups,cats,notes}=DATA;
  $("legend").innerHTML=METHODS.map(m=>`<span class="chip ${m.ours?'ours':''}">${m.ours?'★ ':''}${esc(m.label)}</span>`).join("");
  $("s-cases").textContent=sel.length;$("s-cats").textContent=cats.length;$("s-methods").textContent=METHODS.length;
  if(!sel.length){$("main").innerHTML='<div class="empty">No sample data (missing selected_ids.json / audio).</div>';return;}
  $("catnav").innerHTML=cats.map(c=>`<a href="#${slug(c)}" data-c="${slug(c)}">${EMO[c]||'🎧'} ${esc(c)}</a>`).join("");
  const players=it=>`<div class="m">`+METHODS.map(m=>`<div class="mrow ${m.ours?'ours':''}"><div class="mlabel">${esc(m.label)} ${m.ours?'<span class="tag-ours">OURS</span>':''}</div><audio controls preload="none" data-src="${(AUDIO[m.dir]||{})[it.id]||''}"></audio></div>`).join("")+`</div>`;
  const card=it=>`<div class="case" data-rv><div class="id">${it.id}</div><div class="txt">${marked(it.text_marked)}</div>${notes[it.id]?`<div class="note">📝 ${esc(notes[it.id])}</div>`:''}${players(it)}</div>`;
  const col=(L,arr)=>`<div class="langcol"><h3><span class="dot ${L}"></span>${L==='zh'?t.zh:t.en} · ${arr.length}</h3>${arr.map(card).join("")||''}</div>`;
  $("main").innerHTML=cats.map(c=>{const g=groups[c];const n=g.zh.length+g.en.length;
    return `<section class="cat" id="${slug(c)}"><div class="cat-h"><span class="cat-emoji">${EMO[c]||'🎧'}</span><h2>${esc(c)}<span class="zh">${ZH[c]||''}</span></h2><span class="n">${n}</span></div><div class="cat-rule"></div><div class="cols">${col('zh',g.zh)}${col('en',g.en)}</div></section>`;}).join("");
  $("foot").innerHTML=t.foot(sel.length,cats.length);
  // 惰性加载：卡片接近视口时才给 <audio> 赋 src，首屏不产生任何音频请求
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){
    e.target.classList.add("in");
    e.target.querySelectorAll("audio[data-src]").forEach(a=>{const s=a.dataset.src;
      if(s){a.preload="metadata";a.src=s;a.removeAttribute("data-src");}});
    io.unobserve(e.target);}}),{threshold:.08,rootMargin:"400px 0px"});
  document.querySelectorAll("[data-rv]").forEach(el=>io.observe(el));
  const links=[...document.querySelectorAll("nav.cats a")];
  const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle("active",l.dataset.c===e.target.id));}),{rootMargin:"-40% 0px -55% 0px"});
  document.querySelectorAll("section.cat").forEach(s=>spy.observe(s));
}
$("langbtn").onclick=()=>{LANG=LANG==="zh"?"en":"zh";localStorage.setItem("nvv_ui_lang",LANG);applyChrome();render();};
$("backtop").onclick=()=>scrollTo({top:0,behavior:"smooth"});
addEventListener("scroll",()=>{$("backtop").style.display=scrollY>600?"block":"none";});
applyChrome();
Promise.resolve().then(()=>{ const M=NVV_MANIFEST, selj=NVV_SEL;
  const METHODS=M.methods,byId=Object.fromEntries(M.items.map(i=>[i.id,i]));
  const notes={};(Array.isArray(selj)?selj:[]).forEach(x=>{const id=x.id||x;notes[id]=x.note||"";});
  let ids=Object.keys(notes);if(!ids.length)ids=M.items.map(i=>i.id);
  const sel=ids.map(id=>byId[id]).filter(Boolean);
  const groups={};sel.forEach(it=>{(groups[it.event]=groups[it.event]||{zh:[],en:[]})[it.lang].push(it);});
  const cats=Object.keys(groups).sort((a,b)=>{if(a==='burp')return 1;if(b==='burp')return -1;return a.localeCompare(b);});
  DATA={METHODS,sel,groups,cats,notes};render();
}).catch(e=>{$("main").innerHTML='<div class="empty">加载失败 / load error：请用 python -m http.server 启动本目录。</div>';});
